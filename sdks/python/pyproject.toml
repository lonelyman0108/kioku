[project]
name = "kioku-client"
version = "0.1.0"
description = "Kioku 接入接口的 Python 客户端，由服务端的 OpenAPI 生成"
readme = "README.md"
license = "Apache-2.0"
# 生成的代码用了 enum.StrEnum 与 typing.Self，要 3.11 以上
requires-python = ">=3.11"
# 会装进宿主（例如 AstrBot）的环境，和宿主自己的依赖共用，所以只给范围；开发工具在下面写死
dependencies = ["attrs>=22.2.0", "httpx>=0.23.0,<1"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.0"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kioku_client"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# 生成的代码只管格式，写法按生成工具的来
exclude = ["kioku_client/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
