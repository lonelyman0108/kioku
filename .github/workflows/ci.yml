# 唯一的必需检查：状态检查名固定为「gate」。
# 硬规则：job id 就叫 gate 且不写 name；不写 paths 过滤；gate 不写 job 级 if；
# 每个 job 写 runs-on 与 timeout-minutes；判断和命令全部放在 scripts/，这里只做薄壳。
name: CI
on:
  pull_request:
  push:
    branches: [main]
# PR 按 ref 分组，新推送取消同一 PR 的旧 run；push 按 SHA 分组，每条提交都完整复核
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
# run 一律用 bash（-eo pipefail），不依赖 runner 镜像的默认 shell
defaults:
  run:
    shell: bash
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # 不可信字段只经 env 传入，不直接拼进 run
      PR_TITLE: ${{ github.event.pull_request.title }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # pnpm 版本取自 package.json 的 packageManager，Node 版本取自 .node-version
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: 准备工具
        run: scripts/ci/setup-tools.sh >> "$GITHUB_PATH"
      - name: 提交信息
        run: scripts/ci/check-msg.sh
      - name: 改动类型
        id: kind
        run: scripts/ci/changed-kind.sh >> "$GITHUB_OUTPUT"
      - name: 快速检查
        if: steps.kind.outputs.code != 'true'
        run: scripts/check.sh --quick
      - name: 测试数据库
        if: steps.kind.outputs.code == 'true'
        run: scripts/ci/test-db.sh
      - name: 完整检查
        if: steps.kind.outputs.code == 'true'
        run: scripts/check.sh --full
      - name: 镜像
        if: steps.kind.outputs.code == 'true'
        run: scripts/ci/smoke-image.sh
