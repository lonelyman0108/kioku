# 推送 vX.Y.Z tag 后：跑完整门禁，再建或更新 GitHub Release，正文取 CHANGELOG.md 里对应版本的一节；
# 门禁通过后构建并推送服务端与数据库镜像（images.yml），标签是 X.Y.Z，比已有的都新时再打 X.Y 与 latest，预发布版只打 X.Y.Z。
# tag 只由维护者打；workflow 不写 concurrency（避免误取消排队中的 job）。只有推镜像的 job 进 images-release 组：
# 两次发布的镜像排队推，不并行改同一批标签，也不取消正在推的那次。
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
# run 一律用 bash（-eo pipefail），不依赖 runner 镜像的默认 shell
defaults:
  run:
    shell: bash
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # pnpm 版本取自 package.json 的 packageManager，Node 版本取自 .node-version
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      # uv 给 Python 的 SDK 与插件用；setup-uv 没有浮动的大版本标签，按提交钉住（v10.3.2）
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: 0.13.5
          # 发布不用 uv 的缓存（setup-uv 在 tag 推送时本来也不用，这里写明）
          enable-cache: false
      - name: 准备工具
        run: scripts/ci/setup-tools.sh >> "$GITHUB_PATH"
      - name: 测试数据库
        run: scripts/ci/test-db.sh
      - name: 门禁
        run: scripts/check.sh --full
      - name: Release 页
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/release-page.sh "$GITHUB_REF_NAME"

  images:
    needs: release
    # fork 里没有推这些镜像仓库的权限，不跑
    if: github.repository == 'lonelyman0108/kioku'
    concurrency:
      group: images-release
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      ref: ${{ github.ref_name }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
