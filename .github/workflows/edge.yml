# main 每次合并后构建并推送服务端与数据库镜像的 edge 标签（images.yml），版本写 edge。
# 单独一个 workflow，不拖慢 PR 的门禁；合并进来的提交已经过了 PR 的门禁，这里不再跑。
name: Edge
on:
  push:
    branches: [main]
# 连着合并几次时只推最新的一次：旧的 run 被取消
concurrency:
  group: edge-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  images:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      ref: edge
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
